<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handball Statistik</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #17212b;
    --panel-2: #1e2b38;
    --accent: #f97316;
    --accent-2: #22c55e;
    --danger: #ef4444;
    --warn: #eab308;
    --text: #e5e7eb;
    --text-dim: #94a3b8;
    --border: #2a3947;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 21px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #fullscreenBtn {
    flex-shrink: 0;
    white-space: nowrap;
  }
  body:fullscreen {
    overflow-y: auto;
    padding: 16px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: #24333f; }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--accent); color: #1a1004; font-weight: 600; border-color: transparent; }
  button.primary:hover { background: #fb923c; }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button.danger:hover { background: rgba(239,68,68,0.12); }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 0.95rem;
    margin: 0 0 10px 0;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Spieler hinzufügen */
  .add-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-row input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
  }
  .add-row input[type="text"] { flex: 1; min-width: 140px; }
  .add-row input[type="number"] { width: 80px; }

  /* Spielerliste */
  #playerCount {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: normal;
    text-transform: none;
    letter-spacing: normal;
  }

  .table-wrap {
    overflow-x: auto;
  }
  table.stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.stats-table th, table.stats-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.stats-table th {
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
  }
  table.stats-table th.num, table.stats-table td.num { text-align: center; }
  table.stats-table tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; }
  table.stats-table tbody tr:hover { background: rgba(255,255,255,0.02); }

  .player-number {
    background: var(--accent);
    color: #1a1004;
    font-weight: 700;
    font-size: 0.85rem;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .player-name-cell {
    font-weight: 600;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .remove-btn, .edit-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    font-size: 1.1rem;
    padding: 2px 6px;
    line-height: 1;
  }
  .remove-btn:hover { color: var(--danger); background: transparent; }
  .edit-btn:hover { color: var(--accent); background: transparent; }

  .row-actions {
    display: flex;
    gap: 2px;
  }

  .edit-row {
    display: flex;
    gap: 6px;
  }
  .edit-row input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  .edit-row input[type="text"] { width: 130px; }
  .edit-row input[type="number"] { width: 56px; }
  .edit-actions {
    display: flex;
    gap: 4px;
  }
  .edit-actions button {
    padding: 6px 8px;
    font-size: 0.9rem;
  }

  .stat-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .stat-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    padding: 0;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-value {
    min-width: 22px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .stat-tore .stat-value { color: var(--accent-2); }
  .stat-fehlwurf .stat-value { color: var(--warn); }
  .stat-technisch .stat-value { color: var(--danger); }
  .stat-abwehr .stat-value { color: #38bdf8; }

  .drag-handle-cell {
    width: 30px;
  }
  .drag-handle {
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    color: var(--text-dim);
    font-size: 1.15rem;
    display: inline-block;
    padding: 4px 6px;
    line-height: 1;
  }
  .drag-handle:active { cursor: grabbing; }
  table.stats-table tbody tr.dragging { opacity: 0.4; }
  table.stats-table tbody tr.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  table.stats-table tbody tr.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }

  .empty-hint {
    color: var(--text-dim);
    font-size: 0.9rem;
    text-align: center;
    padding: 20px 0;
  }

  .footer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .footer-actions-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Spieler hinzufügen</h2>
  <div class="add-row">
    <input type="number" id="newNumber" placeholder="Nr." min="1" max="99">
    <input type="text" id="newName" placeholder="Name des Spielers" maxlength="30">
    <button class="primary" id="addBtn">+ Hinzufügen</button>
  </div>
</div>

<div class="card">
  <h2>Spieler & Statistik <span id="playerCount">(0/16)</span></h2>
  <div class="table-wrap">
    <table class="stats-table">
      <thead>
        <tr>
          <th></th>
          <th>Nr.</th>
          <th>Name</th>
          <th class="num">Tore</th>
          <th class="num">Fehlwürfe</th>
          <th class="num">Techn. Fehler</th>
          <th class="num">Abwehrfehler</th>
          <th class="num">Aktionen</th>
        </tr>
      </thead>
      <tbody id="playerBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="3">Gesamt</td>
          <td class="num" id="totalTore">0</td>
          <td class="num" id="totalFehl">0</td>
          <td class="num" id="totalTech">0</td>
          <td class="num" id="totalAbwehr">0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
  <div id="emptyHint" class="empty-hint">Noch keine Spieler erfasst. Füge oben deinen ersten Spieler hinzu.</div>
  <div class="footer-actions">
    <div class="footer-actions-group">
      <button class="ghost" id="exportBtn">📋 Als Text kopieren</button>
      <button class="ghost" id="exportFileBtn">💾 Als Datei speichern</button>
      <button class="ghost" id="importBtn">📂 Datei laden</button>
      <input type="file" id="importInput" accept=".json,application/json" style="display:none">
      <button class="ghost" id="fullscreenBtn" title="Vollbild umschalten">⛶ Vollbild</button>
    </div>
    <button class="danger" id="resetBtn">Spiel zurücksetzen</button>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'handball-stats-v1';
  const MAX_PLAYERS = 16;

  /** @type {{id:string, number:string, name:string, tore:number, fehlwurf:number, technisch:number, abwehr:number}[]} */
  let players = [];
  let editingId = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        players = JSON.parse(raw);
        players.forEach(p => { if (typeof p.abwehr !== 'number') p.abwehr = 0; });
      }
    } catch (e) {
      console.error('Konnte Daten nicht laden', e);
      players = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
    } catch (e) {
      console.error('Konnte Daten nicht speichern', e);
    }
  }

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function addPlayer(number, name) {
    if (players.length >= MAX_PLAYERS) return;
    if (!name.trim()) return;
    players.push({
      id: uid(),
      number: number ? String(number) : '',
      name: name.trim(),
      tore: 0,
      fehlwurf: 0,
      technisch: 0,
      abwehr: 0
    });
    save();
    render();
  }

  function removePlayer(id) {
    const p = players.find(p => p.id === id);
    if (p && !confirm(`Spieler "${p.name}" wirklich entfernen?`)) return;
    players = players.filter(p => p.id !== id);
    if (editingId === id) editingId = null;
    save();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  function saveEdit(id) {
    const numInput = document.getElementById(`edit-num-${id}`);
    const nameInput = document.getElementById(`edit-name-${id}`);
    const name = nameInput.value.trim();
    if (!name) {
      alert('Bitte einen Namen eingeben.');
      return;
    }
    const p = players.find(p => p.id === id);
    if (!p) return;
    p.name = name;
    p.number = numInput.value ? String(numInput.value) : '';
    editingId = null;
    save();
    render();
  }

  function changeStat(id, key, delta) {
    const p = players.find(p => p.id === id);
    if (!p) return;
    p[key] = Math.max(0, (p[key] || 0) + delta);
    save();
    render();
  }

  function resetGame() {
    if (!confirm('Alle Statistikwerte für dieses Spiel zurücksetzen? Die Spielerliste bleibt erhalten.')) return;
    players.forEach(p => { p.tore = 0; p.fehlwurf = 0; p.technisch = 0; p.abwehr = 0; });
    save();
    render();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function statCell(value, id, key, cssClass) {
    return `
      <td class="num ${cssClass}">
        <div class="stat-controls">
          <button class="stat-btn" onclick="HB.changeStat('${id}', '${key}', -1)" ${value === 0 ? 'disabled' : ''}>−</button>
          <span class="stat-value">${value}</span>
          <button class="stat-btn" onclick="HB.changeStat('${id}', '${key}', 1)">+</button>
        </div>
      </td>`;
  }

  function render() {
    const body = document.getElementById('playerBody');
    const emptyHint = document.getElementById('emptyHint');
    const countLabel = document.getElementById('playerCount');
    const addBtn = document.getElementById('addBtn');

    countLabel.textContent = `(${players.length}/${MAX_PLAYERS})`;
    addBtn.disabled = players.length >= MAX_PLAYERS;

    if (players.length === 0) {
      body.innerHTML = '';
      emptyHint.style.display = 'block';
    } else {
      emptyHint.style.display = 'none';
      body.innerHTML = players.map(p => {
        if (p.id === editingId) {
          return `
            <tr data-id="${p.id}">
              <td></td>
              <td colspan="2">
                <div class="edit-row">
                  <input type="number" id="edit-num-${p.id}" value="${escapeHtml(p.number)}" placeholder="Nr." min="1" max="99">
                  <input type="text" id="edit-name-${p.id}" value="${escapeHtml(p.name)}" placeholder="Name" maxlength="30" onkeydown="if(event.key==='Enter'){HB.saveEdit('${p.id}')} if(event.key==='Escape'){HB.cancelEdit()}">
                </div>
              </td>
              ${statCell(p.tore, p.id, 'tore', 'stat-tore')}
              ${statCell(p.fehlwurf, p.id, 'fehlwurf', 'stat-fehlwurf')}
              ${statCell(p.technisch, p.id, 'technisch', 'stat-technisch')}
              ${statCell(p.abwehr, p.id, 'abwehr', 'stat-abwehr')}
              <td class="num">
                <div class="edit-actions">
                  <button title="Speichern" onclick="HB.saveEdit('${p.id}')">✓</button>
                  <button class="ghost" title="Abbrechen" onclick="HB.cancelEdit()">✕</button>
                </div>
              </td>
            </tr>`;
        }
        return `
          <tr data-id="${p.id}">
            <td class="drag-handle-cell"><span class="drag-handle" title="Ziehen zum Sortieren">⠿</span></td>
            <td><span class="player-number">${escapeHtml(p.number || '-')}</span></td>
            <td class="player-name-cell">${escapeHtml(p.name)}</td>
            ${statCell(p.tore, p.id, 'tore', 'stat-tore')}
            ${statCell(p.fehlwurf, p.id, 'fehlwurf', 'stat-fehlwurf')}
            ${statCell(p.technisch, p.id, 'technisch', 'stat-technisch')}
            ${statCell(p.abwehr, p.id, 'abwehr', 'stat-abwehr')}
            <td class="num">
              <div class="row-actions">
                <button class="edit-btn" title="Spieler bearbeiten" onclick="HB.startEdit('${p.id}')">✎</button>
                <button class="remove-btn" title="Spieler entfernen" onclick="HB.removePlayer('${p.id}')">✕</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    document.getElementById('totalTore').textContent = players.reduce((s, p) => s + p.tore, 0);
    document.getElementById('totalFehl').textContent = players.reduce((s, p) => s + p.fehlwurf, 0);
    document.getElementById('totalTech').textContent = players.reduce((s, p) => s + p.technisch, 0);
    document.getElementById('totalAbwehr').textContent = players.reduce((s, p) => s + p.abwehr, 0);
  }

  function exportText() {
    if (players.length === 0) {
      alert('Keine Spieler zum Exportieren vorhanden.');
      return;
    }
    let lines = ['Handball Statistik', '', 'Nr | Name | Tore | Fehlwürfe | Techn. Fehler | Abwehrfehler'];
    players.forEach(p => {
      lines.push(`${p.number || '-'} | ${p.name} | ${p.tore} | ${p.fehlwurf} | ${p.technisch} | ${p.abwehr}`);
    });
    const totalTore = players.reduce((s, p) => s + p.tore, 0);
    const totalFehl = players.reduce((s, p) => s + p.fehlwurf, 0);
    const totalTech = players.reduce((s, p) => s + p.technisch, 0);
    const totalAbwehr = players.reduce((s, p) => s + p.abwehr, 0);
    lines.push('', `Gesamt | | ${totalTore} | ${totalFehl} | ${totalTech} | ${totalAbwehr}`);
    const text = lines.join('\n');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Statistik wurde in die Zwischenablage kopiert.');
      }).catch(() => {
        prompt('Kopieren fehlgeschlagen. Manuell kopieren:', text);
      });
    } else {
      prompt('Statistik (manuell kopieren):', text);
    }
  }

  async function exportFile() {
    if (players.length === 0) {
      alert('Keine Spieler zum Speichern vorhanden.');
      return;
    }
    const payload = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), players }, null, 2);
    const filename = `handball-statistik-${new Date().toISOString().slice(0, 10)}.json`;

    if (!window.claude || typeof window.claude.use !== 'function') {
      alert('Datei-Export wird in dieser Ansicht nicht unterstützt.');
      return;
    }
    try {
      const downloads = await window.claude.use('downloads');
      if (!downloads) {
        alert('Datei-Export ist in dieser Ansicht nicht verfügbar.');
        return;
      }
      await downloads.save({ filename, data: payload });
    } catch (err) {
      if (err && err.code === 'declined') return;
      console.error('Export fehlgeschlagen', err);
      alert('Export fehlgeschlagen: ' + (err && err.message ? err.message : 'Unbekannter Fehler'));
    }
  }

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const incoming = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.players) ? parsed.players : null);
        if (!incoming) throw new Error('Die Datei enthält keine erkennbare Spielerliste.');
        const num = (v) => {
          const n = Math.floor(Number(v));
          return Number.isFinite(n) && n >= 0 ? n : 0;
        };
        const cleaned = incoming
          .slice(0, MAX_PLAYERS)
          .map(p => ({
            id: uid(),
            number: p && p.number ? String(p.number) : '',
            name: p && typeof p.name === 'string' ? p.name.trim() : '',
            tore: num(p && p.tore),
            fehlwurf: num(p && p.fehlwurf),
            technisch: num(p && p.technisch),
            abwehr: num(p && p.abwehr)
          }))
          .filter(p => p.name);
        if (cleaned.length === 0) throw new Error('Keine gültigen Spieler in der Datei gefunden.');
        if (!confirm(`${cleaned.length} Spieler aus der Datei laden? Die aktuelle Liste wird ersetzt.`)) return;
        players = cleaned;
        editingId = null;
        save();
        render();
      } catch (err) {
        alert('Die Datei konnte nicht gelesen werden: ' + (err && err.message ? err.message : 'Ungültiges Format'));
      }
    };
    reader.onerror = () => alert('Die Datei konnte nicht gelesen werden.');
    reader.readAsText(file);
  }

  // Event wiring
  document.getElementById('addBtn').addEventListener('click', () => {
    const numInput = document.getElementById('newNumber');
    const nameInput = document.getElementById('newName');
    addPlayer(numInput.value, nameInput.value);
    numInput.value = '';
    nameInput.value = '';
    nameInput.focus();
  });

  document.getElementById('newName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });
  document.getElementById('newNumber').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });

  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('exportBtn').addEventListener('click', exportText);
  document.getElementById('exportFileBtn').addEventListener('click', exportFile);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());
  document.getElementById('importInput').addEventListener('change', handleImportFile);

  const fullscreenBtn = document.getElementById('fullscreenBtn');
  function updateFullscreenBtn() {
    fullscreenBtn.textContent = document.fullscreenElement ? '⛶ Vollbild beenden' : '⛶ Vollbild';
  }
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {
        alert('Vollbild wird von diesem Browser oder in diesem Kontext nicht unterstützt.');
      });
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', updateFullscreenBtn);
  if (!document.fullscreenEnabled) {
    fullscreenBtn.style.display = 'none';
  }

  // Expose for inline onclick handlers
  window.HB = { removePlayer, changeStat, startEdit, cancelEdit, saveEdit };

  // Drag & Drop zum Umsortieren
  const playerBody = document.getElementById('playerBody');
  let dragSourceId = null;

  playerBody.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const row = handle.closest('tr');
    if (!row || !row.dataset.id) return;
    dragSourceId = row.dataset.id;
    row.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('pointermove', (e) => {
    if (!dragSourceId) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetRow = el ? el.closest('tr[data-id]') : null;
    playerBody.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
    if (!targetRow || targetRow.dataset.id === dragSourceId) return;
    const rect = targetRow.getBoundingClientRect();
    const isAfter = e.clientY > rect.top + rect.height / 2;
    targetRow.classList.add(isAfter ? 'drag-over-bottom' : 'drag-over-top');
  });

  function endDrag() {
    if (!dragSourceId) return;
    const sourceId = dragSourceId;
    dragSourceId = null;
    const markedTop = playerBody.querySelector('.drag-over-top');
    const markedBottom = playerBody.querySelector('.drag-over-bottom');
    const targetRow = markedTop || markedBottom;
    playerBody.querySelectorAll('.dragging, .drag-over-top, .drag-over-bottom').forEach(r => r.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
    if (!targetRow) return;
    const targetId = targetRow.dataset.id;
    if (targetId === sourceId) return;
    const fromIndex = players.findIndex(p => p.id === sourceId);
    let toIndex = players.findIndex(p => p.id === targetId);
    if (fromIndex === -1 || toIndex === -1) return;
    if (markedBottom) toIndex += 1;
    const [moved] = players.splice(fromIndex, 1);
    if (toIndex > fromIndex) toIndex -= 1;
    players.splice(toIndex, 0, moved);
    save();
    render();
  }

  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', () => {
    dragSourceId = null;
    playerBody.querySelectorAll('.dragging, .drag-over-top, .drag-over-bottom').forEach(r => r.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
  });

  load();
  render();
})();
</script>

</body>
</html>
